# Forensic Triage Configuration
# Configuration file for artifact collection

artifacts:
  # System information files
  system:
    - /etc/os-release
    - /etc/issue
    - /etc/lsb-release
    - /etc/redhat-release
  
  # User information files
  users:
    - /etc/passwd
    - /etc/shadow
    - /etc/group
    - /etc/gshadow
  
  # Command history patterns
  history:
    - /home/*/.bash_history
    - /home/*/.zsh_history
    - /root/.bash_history
    - /root/.zsh_history
    - /home/*/.history
    - /root/.history
  
  # System services
  services:
    - /etc/systemd/system
    - /etc/init.d
    - /etc/rc.d
    - /etc/xinetd.d
  
  # Cron jobs
  cron:
    - /etc/crontab
    - /var/spool/cron
    - /etc/cron.d
    - /etc/cron.daily
    - /etc/cron.hourly
    - /etc/cron.weekly
    - /etc/cron.monthly
  
  # Package information
  packages:
    - /var/lib/dpkg/status  # Debian/Ubuntu
    - /var/lib/rpm  # RedHat/CentOS
    - /var/lib/pacman  # Arch Linux
  
  # Log directories
  logs:
    var:
      - /var/log
    www:
      - /var/www
      - /usr/share/nginx
      - /etc/nginx
      - /etc/apache2
      - /etc/httpd
  
  # Docker information
  docker:
    - /var/lib/docker
    - /etc/docker
    - /root/.docker
  
  # Network configuration
  network:
    - /etc/hosts
    - /etc/resolv.conf
    - /etc/network
    - /etc/sysconfig/network-scripts
  
  # SSH configuration
  ssh:
    - /etc/ssh
    - /root/.ssh
    - /home/*/.ssh

# Collection settings
settings:
  max_files_per_directory: 200
  max_log_files: 100
  extract_compressed: true
  calculate_hashes: true
  generate_iocs: true



